[project]
name = "1ops"
version = "0.2.0"
description = "1ops by OceanSoft.io: set up the 1ops plugin, settings and read-only cloud connectors for an organisation, team or person."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Nhat-Thanh Nguyen", email = "nnthanh101@gmail.com" }]
keywords = ["finops", "cloudops", "aws", "azure", "itsm", "oceansoft"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = ["pyyaml>=6.0.3", "rich>=15.0.0"]

[project.urls]
Homepage = "https://www.oceansoft.io"
Repository = "https://github.com/nnthanh101/1ops"
Issues = "https://github.com/nnthanh101/1ops/issues"

[project.scripts]
1ops = "one_ops.cli:main"

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17"]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/one_ops"]

[tool.hatch.build.targets.sdist]
include = ["src/one_ops", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
