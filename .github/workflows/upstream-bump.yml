name: Upstream bump

# Monthly: move the knowledge-work-plugins pin to upstream main and open a PR to develop.
# Locally: act workflow_dispatch -W .github/workflows/upstream-bump.yml --secret-file .secrets
on:
  schedule:
    - cron: "0 22 1 * *" # 1st of the month, 22:00 UTC (morning in NZ and eastern Australia)
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # pushes the feature/upstream-bump-* branch
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          submodules: true
      - name: Update the pin and open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          old=$(git -C upstream/knowledge-work-plugins rev-parse --short HEAD)
          git submodule update --remote upstream/knowledge-work-plugins
          new=$(git -C upstream/knowledge-work-plugins rev-parse --short HEAD)
          if [ "$old" = "$new" ]; then echo "Already at upstream $new"; exit 0; fi
          branch="feature/upstream-bump-$(date -u +%Y-%m)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch already exists; merge or close that PR first"; exit 0
          fi
          # The upstream plugins 1xops depends on, read from plugin.json so the list is never kept twice
          deps=$(jq -r '.dependencies[] | select(endswith("@knowledge-work-plugins")) | sub("@.*"; "")' \
            plugins/1xops/.claude-plugin/plugin.json)
          # Every one of them must still be there, or 1xops would fail to install for the customer
          for d in $deps; do
            test -f "upstream/knowledge-work-plugins/$d/.claude-plugin/plugin.json" \
              || { echo "upstream moved or removed $d/"; exit 1; }
          done
          test -d upstream/knowledge-work-plugins/operations/skills || { echo "upstream moved operations/skills/"; exit 1; }
          for p in plugins/*/; do
            test -f "$p.claude-plugin/plugin.json" || { echo "$p no longer resolves in upstream"; exit 1; }
          done
          # The upstream plugins linked under plugins/ (the folders this repo serves and validates)
          linked=$(for p in plugins/*/; do [ -L "${p%/}" ] && basename "$p"; done)
          # shellcheck disable=SC2086 # one path argument per plugin folder
          all=$(git -C upstream/knowledge-work-plugins log --oneline "$old..$new" -- $deps $linked)
          ops=$(echo "$all" | head -100)
          [ "$(echo "$all" | wc -l)" -gt 100 ] && ops="$ops"$'\n'"…and more: see the compare link above."
          # A pull request opened with GITHUB_TOKEN starts no workflow, so the plugin checks of the Release
          # workflow (the only ones the pin can change) run here, before the PR exists.
          npm install --no-save --prefix "$RUNNER_TEMP/v" @anthropic-ai/claude-code@2.1.325
          node "$RUNNER_TEMP/v/node_modules/@anthropic-ai/claude-code/install.cjs"
          "$RUNNER_TEMP/v/node_modules/.bin/claude" plugin validate --strict .
          "$RUNNER_TEMP/v/node_modules/.bin/claude" plugin validate --strict plugins/1xops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore: knowledge-work-plugins $old → $new"
          git push -u origin "$branch"
          body="Monthly upstream pin bump. All upstream changes: https://github.com/anthropics/knowledge-work-plugins/compare/$old...$new"
          body="$body"$'\n\n'"Plugin validation passed in the bump job (strict, pinned validator). Run task gate locally before merging."
          body="$body"$'\n\n'"Changes in the plugins 1xops depends on or links ($(echo $deps $linked | tr ' ' '\n' | sort -u | paste -sd, -)):"$'\n\n'"${ops:-none}"
          gh pr create --base develop --title "chore: knowledge-work-plugins $old → $new" --body "$body"
