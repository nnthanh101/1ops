name: Release

# Publishes PyPI, npm and Docker Hub from a v* tag on main, after a named approver
# accepts the `release` environment. The same jobs run locally with act:
#   act workflow_dispatch -W .github/workflows/release.yml --secret-file .secrets   (owner only)
# Secrets (set by the owner, never committed):
#   PYPI_TOKEN       only for act; on GitHub, PyPI trusted publishing (OIDC) is used
#   NPM_TOKEN        first release only; empty → npm trusted publishing (OIDC). See docs/adr/0002
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   Docker Hub mirror (waiver in docs/adr/0002)
# ghcr.io uses the automatic, short-lived GITHUB_TOKEN.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        name: Tag, pyproject and package.json agree; commit is on main
        run: |
          py=$(grep -E '^version = ' packages/python/pyproject.toml | cut -d'"' -f2)
          js=$(node -p "require('./packages/npm/package.json').version")
          test "$py" = "$js" || { echo "pyproject $py != package.json $js"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF#refs/tags/v}" = "$py" || { echo "tag != $py"; exit 1; }
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "commit is not on main"; exit 1; }
          echo "version=$py" >> "$GITHUB_OUTPUT"

  pypi:
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
        working-directory: packages/python
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: packages/python/dist
          password: ${{ secrets.PYPI_TOKEN }} # empty on GitHub → trusted publishing

  npm:
    needs: [check, pypi] # the npm launcher runs the PyPI version, so PyPI goes first
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !env.ACT }}
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm auth (act only; on GitHub setup-node writes it)
        if: ${{ env.ACT }}
        run: echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc
      - run: npm publish --access public $([ "$ACT" = "true" ] || echo --provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    needs: check
    if: ${{ !github.event.act }} # images publish from GitHub only: the act runner image has no Docker CLI
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/python
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/nnthanh101/1xops:${{ needs.check.outputs.version }}
            ghcr.io/nnthanh101/1xops:latest
            nnthanh101/1xops:${{ needs.check.outputs.version }}
            nnthanh101/1xops:latest
          labels: org.opencontainers.image.source=https://github.com/nnthanh101/1xops
