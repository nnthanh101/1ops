name: Upstream bump

# Monthly: move every pin under upstream/ (one submodule per vendor: knowledge-work-plugins, agent-toolkit-for-aws,
# and any vendor added later, found in .gitmodules) to its branch and open one PR to develop.
# Locally: act workflow_dispatch -W .github/workflows/upstream-bump.yml --secret-file .secrets
on:
  schedule:
    - cron: "0 22 1 * *" # 1st of the month, 22:00 UTC (morning in NZ and eastern Australia)
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # pushes the feature/upstream-bump-* branch
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          submodules: true
      - name: Move every pin, check, and open one PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          moved="" notes=""
          for path in $(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '$2 ~ /^upstream\// {print $2}'); do
            old=$(git -C "$path" rev-parse --short HEAD)
            git submodule update --remote "$path"
            new=$(git -C "$path" rev-parse --short HEAD)
            [ "$old" = "$new" ] && { echo "$path already at $new"; continue; }
            name=${path#upstream/}
            moved="$moved ${name} ${old}→${new};"
            url=$(git config -f .gitmodules --get "submodule.$path.url" | sed 's/\.git$//')
            # The plugins 1xops depends on from this vendor: the changes a reviewer must read first
            market=$(jq -r .name "$path/.claude-plugin/marketplace.json" 2>/dev/null)
            deps=$(jq -r --arg m "$market" '.dependencies[]? | strings | select(endswith("@" + $m)) | sub("@.*"; "")' \
              plugins/*/.claude-plugin/plugin.json | sort -u)
            srcs=$(for d in $deps; do jq -r --arg n "$d" '.plugins[] | select(.name == $n) | .source | strings' \
              "$path/.claude-plugin/marketplace.json" | sed 's#^\./##'; done)
            # shellcheck disable=SC2086 # one path argument per plugin folder
            log=$( [ -n "$srcs" ] && git -C "$path" log --oneline "$old..$new" -- $srcs | head -50 )
            notes="$notes"$'\n\n'"### ${name} ${old} → ${new}"$'\n'"All changes: $url/compare/$old...$new"
            notes="$notes"$'\n'"Changes in the plugins 1xops depends on (${deps:+$(printf '%s' "$deps" | tr '\n' ',')}): "$'\n'"${log:-none}"
          done
          [ -z "$moved" ] && { echo "Every pin is already at its upstream branch"; exit 0; }
          branch="feature/upstream-bump-$(date -u +%Y-%m)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch already exists; merge or close that PR first"; exit 0
          fi
          # Every dependency of 1xops still resolves at the new pins, or no PR (the pins stay where they were)
          bash scripts/upstream-check.sh
          # A PR opened with GITHUB_TOKEN starts no workflow, so the Release workflow's plugin checks run here.
          npm install --no-save --prefix "$RUNNER_TEMP/v" @anthropic-ai/claude-code@2.1.325
          node "$RUNNER_TEMP/v/node_modules/@anthropic-ai/claude-code/install.cjs"
          "$RUNNER_TEMP/v/node_modules/.bin/claude" plugin validate --strict .
          "$RUNNER_TEMP/v/node_modules/.bin/claude" plugin validate --strict plugins/1xops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore: upstream pins:$moved"
          git push -u origin "$branch"
          body="Monthly upstream pin bump:$moved"$'\n\n'"upstream-check and strict plugin validation passed in the bump job. Run task gate locally before merging, then update upstream/README.md if a pick changes.$notes"
          gh pr create --base develop --title "chore: upstream pins:$moved" --body "$body"
